<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | FitCloud</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body class="dashboard-pro-body">

<div class="dashboard-pro-layout">

    <!-- SIDEBAR -->
    <div class="dashboard-pro-sidebar">

        <div class="dashboard-pro-brand">💪 FitCloud</div>

        <a href="dashboard.html">📊 Dashboard</a>
        <a href="workout.html">🏋️ Workout</a>
        <a href="bmi.html">⚖️ BMI Calculator</a>
        <a href="water.html">💧 Water Tracker</a>
        <a href="profile.html">👤 Profile</a>

        <button onclick="logout()" class="dashboard-pro-logout">
            🚪 Logout
        </button>

    </div>

    <!-- MAIN -->
    <div class="dashboard-pro-main">

        <!-- TOP HEADER -->
        <div class="dashboard-pro-topbar">

            <div class="dashboard-pro-welcome">
                <h2>👤 My Profile</h2>
                <p>Your personal account details</p>
            </div>

            <div class="dashboard-pro-clock">
                🕒 <span id="clock">00:00:00</span>
            </div>

        </div>

        <!-- PROFILE CARD -->
<div class="dashboard-pro-chart">
  <h3>User Profile</h3>

  <p>Name: <span id="name"></span></p>
  <p>Age: <span id="age"></span></p>
  <p>Gender: <span id="gender"></span></p>
  <p>Weight: <span id="weight"></span> kg</p>
  <p>Height: <span id="height"></span> cm</p>
  <p>Goal: <span id="goal"></span></p>
  <p>Email: <span id="email"></span></p>
</div>

<script type="module" src="profile.js"></script>

        </div>

    </div>
</div>

<script type="module">

import { auth } from "./firebase.js";
import { signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* CLOCK */
function updateClock() {
    const now = new Date();

    let h = String(now.getHours()).padStart(2, '0');
    let m = String(now.getMinutes()).padStart(2, '0');
    let s = String(now.getSeconds()).padStart(2, '0');

    document.getElementById("clock").innerText = `${h}:${m}:${s}`;
}

setInterval(updateClock, 1000);
updateClock();

/* LOAD USER PROFILE */
onAuthStateChanged(auth, (user) => {

    if (user) {
        document.getElementById("email").innerText = user.email;
        document.getElementById("uid").innerText = user.uid;
        document.getElementById("status").innerText = "Active ✅";
    } 
    else {
        document.getElementById("status").innerText = "Not logged in ❌";
        window.location = "login.html";
    }
});

/* LOGOUT */
window.logout = async function () {
    await signOut(auth);
    window.location = "login.html";
};

</script>

</body>
</html>
