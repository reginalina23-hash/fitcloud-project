
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mobile Fitness Tracking</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="app-container">

    <!-- APP TITLE -->

    <div class="header">

        <h1>Mobile Fitness Tracking</h1>

        <p>
            Push yourself stronger every day and achieve your fitness goals.
        </p>

    </div>

    <!-- LOGIN CARD -->

    <div class="login-card">

        <h2>Login</h2>

        <!-- EMAIL -->

        <div class="input-group">

            <input type="email" placeholder="Email Address">

        </div>

        <!-- PASSWORD -->

        <div class="input-group">

            <input type="password" placeholder="Password">

        </div>

        <!-- BUTTONS -->

        <button class="login-btn">
            Login
        </button>

        <button class="signup-btn">
            Sign Up
        </button>

        <!-- FORGOT PASSWORD -->

        <div class="forgot">

            <a href="#">
                Forgot Password?
            </a>

        </div>

    </div>

    <!-- COPYRIGHT -->

    <div class="copyright">

        © 2026 FitCloud System. All Rights Reserved.

    </div>

</div>

</body>

</html>
